<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img"
     aria-label="HA Device Dashboard — a schematic of the card: header chips, a room section, and device tiles">
  <!--
    A schematic of the card in its default Warm Dusk theme, not a screenshot:
    a real one would publish the device names of whoever's house it was taken in.
    Colours are the actual THEME_PRESETS.warm_dusk values from src/themes.ts.
  -->
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241f1b"/>
      <stop offset="1" stop-color="#33291f"/>
    </linearGradient>
    <style>
      .t   { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .nm  { font-size: 13px; font-weight: 700; fill: #ece5dc; }
      .sub { font-size: 10.5px; fill: #b3a596; }
      .mut { font-size: 10px; fill: #7e7265; }
      .val { font-size: 15px; font-weight: 700; fill: #ece5dc; }
      .acc { font-size: 11px; font-weight: 700; fill: #c98a63; }
      .room{ font-size: 10.5px; font-weight: 700; fill: #c98a63; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="880" height="300" rx="16" fill="#1e1a17"/>

  <!-- header with stat chips -->
  <rect x="16" y="16" width="848" height="52" rx="12" fill="url(#hdr)"/>
  <text class="t nm" x="34" y="47">⚡ Shelly</text>
  <g>
    <rect x="120" y="29" width="96" height="26" rx="13" fill="rgba(147,179,132,0.16)"/>
    <text class="t sub" x="136" y="46" fill="#93b384">53/56 online</text>
    <rect x="224" y="29" width="74" height="26" rx="13" fill="rgba(212,127,98,0.16)"/>
    <text class="t sub" x="238" y="46" fill="#d47f62">3 offline</text>
    <rect x="306" y="29" width="82" height="26" rx="13" fill="rgba(219,162,92,0.16)"/>
    <text class="t sub" x="320" y="46" fill="#dba25c">332.7 W</text>
    <rect x="396" y="29" width="104" height="26" rx="13" fill="rgba(219,162,92,0.14)"/>
    <text class="t sub" x="410" y="46" fill="#dba25c">3/8 lights on</text>
  </g>

  <!-- needs attention -->
  <rect x="16" y="80" width="848" height="34" rx="10" fill="rgba(212,127,98,0.07)" stroke="rgba(212,127,98,0.3)"/>
  <text class="t sub" x="34" y="102" fill="#d47f62">▸</text>
  <text class="t nm" x="52" y="102" font-size="12">Needs attention</text>
  <circle cx="168" cy="97" r="9" fill="#d47f62"/>
  <text class="t" x="168" y="101" font-size="10" font-weight="800" fill="#1e1a17" text-anchor="middle">3</text>
  <text class="t mut" x="760" y="102">2 firmware versions</text>

  <!-- room header -->
  <text class="t room" x="20" y="140">LIVING ROOM</text>
  <rect x="120" y="128" width="78" height="18" rx="9" fill="rgba(255,244,232,0.045)"/>
  <text class="t mut" x="130" y="141">Power 41 W</text>
  <rect x="206" y="128" width="86" height="18" rx="9" fill="rgba(255,244,232,0.045)"/>
  <text class="t mut" x="216" y="141">Temp 21.4 °C</text>

  <!-- three tiles: power monitor, light control, input keypad -->
  <g>
    <rect x="16" y="156" width="272" height="126" rx="12" fill="rgba(255,244,232,0.035)" stroke="rgba(255,244,232,0.08)"/>
    <circle cx="34" cy="178" r="4" fill="#93b384"/>
    <text class="t nm" x="46" y="182">Living room</text>
    <rect x="222" y="168" width="50" height="22" rx="11" fill="#c98a63"/>
    <text class="t" x="247" y="183" font-size="10" font-weight="700" fill="#1e1a17" text-anchor="middle">ON</text>
    <text class="t val" x="34" y="216" font-size="26" fill="#dba25c">41.2 W</text>
    <rect x="34" y="230" width="238" height="6" rx="3" fill="rgba(255,244,232,0.06)"/>
    <rect x="34" y="230" width="62" height="6" rx="3" fill="#dba25c"/>
    <polyline points="34,266 68,258 102,262 136,246 170,250 204,238 238,241 272,232"
              fill="none" stroke="#c98a63" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g>
    <rect x="304" y="156" width="272" height="126" rx="12" fill="rgba(255,244,232,0.035)" stroke="rgba(255,244,232,0.08)"/>
    <circle cx="322" cy="178" r="4" fill="#93b384"/>
    <text class="t nm" x="334" y="182">Dining room</text>
    <text class="t sub" x="322" y="208">Brightness</text>
    <rect x="322" y="216" width="200" height="8" rx="4" fill="rgba(255,244,232,0.06)"/>
    <rect x="322" y="216" width="136" height="8" rx="4" fill="#c98a63"/>
    <text class="t acc" x="534" y="224">68%</text>
    <rect x="322" y="240" width="72" height="20" rx="10" fill="rgba(255,244,232,0.045)"/>
    <text class="t mut" x="332" y="254">4.1 W</text>
    <rect x="402" y="240" width="86" height="20" rx="10" fill="rgba(255,244,232,0.045)"/>
    <text class="t mut" x="412" y="254">0.41 kWh</text>
  </g>

  <g>
    <rect x="592" y="156" width="272" height="126" rx="12" fill="rgba(255,244,232,0.035)" stroke="rgba(255,244,232,0.08)"/>
    <circle cx="610" cy="178" r="4" fill="#93b384"/>
    <text class="t nm" x="622" y="182">Living room i4</text>
    <!-- keypad: two keys lit, two not -->
    <rect x="610" y="196" width="118" height="36" rx="10" fill="rgba(201,138,99,0.20)" stroke="rgba(201,138,99,0.45)"/>
    <circle cx="716" cy="206" r="3.5" fill="#c98a63"/>
    <text class="t" x="622" y="212" font-size="11" font-weight="700" fill="#ece5dc">Ceiling</text>
    <text class="t mut" x="622" y="226" font-size="9">Input 1</text>
    <rect x="738" y="196" width="110" height="36" rx="10" fill="rgba(255,244,232,0.05)" stroke="rgba(255,244,232,0.10)"/>
    <text class="t" x="750" y="212" font-size="11" font-weight="700" fill="#ece5dc">Dining</text>
    <text class="t mut" x="750" y="226" font-size="9">Input 2</text>
    <rect x="610" y="238" width="118" height="36" rx="10" fill="rgba(255,244,232,0.05)" stroke="rgba(255,244,232,0.10)"/>
    <text class="t" x="622" y="254" font-size="11" font-weight="700" fill="#ece5dc">Lamp</text>
    <text class="t mut" x="622" y="268" font-size="9">Input 3</text>
    <rect x="738" y="238" width="110" height="36" rx="10" fill="rgba(201,138,99,0.20)" stroke="rgba(201,138,99,0.45)"/>
    <circle cx="836" cy="248" r="3.5" fill="#c98a63"/>
    <text class="t" x="750" y="254" font-size="11" font-weight="700" fill="#ece5dc">TV Room</text>
    <text class="t mut" x="750" y="268" font-size="9">Input 4</text>
  </g>
</svg>
